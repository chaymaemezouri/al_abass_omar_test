# PRODUCTION — electoralavatar.academyskills.net
# Same app as al-abass-omar (PM2 port 3011, path /var/www/al-abass-omar/app)
#
# First-time HTTPS on VPS:
#   sudo cp deploy/nginx/electoralavatar.academyskills.net.conf /etc/nginx/sites-available/electoral-avatar.conf
#   sudo ln -sf /etc/nginx/sites-available/electoral-avatar.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d electoralavatar.academyskills.net
#   (certbot updates ssl_certificate paths below if needed)
#
# Or obtain cert first, then fix paths to match:
#   sudo certbot certonly --nginx -d electoralavatar.academyskills.net

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name electoralavatar.academyskills.net;

    ssl_certificate /etc/letsencrypt/live/electoralavatar.academyskills.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/electoralavatar.academyskills.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /candidate-speaking/ {
        alias /var/www/al-abass-omar/app/public/candidate-speaking/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /assets/ {
        alias /var/www/al-abass-omar/app/.output/public/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name electoralavatar.academyskills.net;
    return 301 https://$host$request_uri;
}
