services:
  db:
    image: pgvector/pgvector:pg16
    container_name: avatar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-avatar_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-avatar_kb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-avatar_app} -d ${POSTGRES_DB:-avatar_kb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - avatar_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avatar_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-avatar_app}:${POSTGRES_PASSWORD:-change-me-strong-db-password}@db:5432/${POSTGRES_DB:-avatar_kb}
    volumes:
      - ./data:/app/data:ro
      - ./media:/app/media
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/tests:/app/tests
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - avatar_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: avatar_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - avatar_net

  nginx:
    image: nginx:1.27-alpine
    container_name: avatar_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./media:/var/www/media:ro
    depends_on:
      - frontend
      - backend
    networks:
      - avatar_net
    profiles:
      - production

volumes:
  postgres_data:

networks:
  avatar_net:
    driver: bridge
