# PRODUCTION — al-abass-omar.academyskills.net
# PM2 app on 127.0.0.1:3011 (see deploy/ecosystem.prod.config.cjs)
# Install on VPS:
#   sudo cp deploy/nginx/al-abass-omar.academyskills.net.conf /etc/nginx/sites-available/al-abass-omar.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name al-abass-omar.academyskills.net;

    ssl_certificate /etc/letsencrypt/live/al-abass-omar.academyskills.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/al-abass-omar.academyskills.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name al-abass-omar.academyskills.net;
    return 301 https://$host$request_uri;
}
