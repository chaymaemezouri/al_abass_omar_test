# Production overrides — used with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile production up -d
# Traffic only via Nginx :80/:443 (no public Postgres/app ports).

services:
  db:
    ports: !override []
    restart: always

  backend:
    restart: always
    ports: !override []
    volumes: !override
      - ./data:/app/data:ro
      - ./media:/app/media
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      POSTGRES_HOST: db

  frontend:
    restart: always
    ports: !override []
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

  nginx:
    restart: always
    profiles:
      - production
